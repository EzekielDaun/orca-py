[project]
    authors = [
        { name = "Yifei Liu", email = "34564223+EzekielDaun@users.noreply.github.com" },
    ]
    dependencies = ["pymodbus (>=3.8.3,<4.0.0)", "pyserial (>=3.5,<4.0)"]
    description = "ORCA-py is an unofficial library for the ORCA Series motor from Iris Dynamics"
    name = "orca-py"
    readme = "README.md"
    requires-python = ">=3.10"
    version = "0.0.2"

[tool.poetry.group.dev.dependencies]
    numpy = "^2.0.0"

[build-system]
    build-backend = "poetry.core.masonry.api"
    requires      = ["poetry-core>=2.0.0,<3.0.0"]
